<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toast Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
</head>
<body>
    <div class="container mt-5">
        <h1>Toast Notification Test</h1>
        <p>Click the buttons below to test each toast type:</p>

        <button class="btn btn-success m-2" onclick="testToast('success')">Test Success</button>
        <button class="btn btn-danger m-2" onclick="testToast('syntax_error')">Test Syntax Error</button>
        <button class="btn btn-warning m-2" onclick="testToast('wellformedness_error')">Test Wellformedness Error</button>
        <button class="btn btn-warning m-2" onclick="testToast('unsat')">Test UNSAT</button>
        <button class="btn btn-warning m-2" onclick="testToast('violated')">Test Property Violations</button>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
        <div id="notificationToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <i id="toastIcon" class="bi me-2"></i>
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastBody">
                Message here
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    function showToast(title, message, type = 'info') {
        const toast = document.getElementById('notificationToast');
        const toastTitle = document.getElementById('toastTitle');
        const toastBody = document.getElementById('toastBody');
        const toastIcon = document.getElementById('toastIcon');
        const toastHeader = toast.querySelector('.toast-header');

        toastTitle.textContent = title;
        toastBody.textContent = message;

        // Reset classes
        toastHeader.className = 'toast-header';
        toastIcon.className = 'bi me-2';

        // Apply type-specific styling
        if (type === 'success') {
            toastHeader.classList.add('bg-success', 'text-white');
            toastIcon.classList.add('bi-check-circle-fill');
        } else if (type === 'error') {
            toastHeader.classList.add('bg-danger', 'text-white');
            toastIcon.classList.add('bi-x-circle-fill');
        } else if (type === 'warning') {
            toastHeader.classList.add('bg-warning');
            toastIcon.classList.add('bi-exclamation-triangle-fill');
        } else {
            toastHeader.classList.add('bg-info', 'text-white');
            toastIcon.classList.add('bi-info-circle-fill');
        }

        // Show toast
        const bsToast = new bootstrap.Toast(toast, { delay: 5000 });
        bsToast.show();
    }

    function testToast(vStatus) {
        console.log('Testing toast for status:', vStatus);

        if (vStatus === 'syntax_error') {
            showToast('Syntax Error', 'Found syntax errors in tasknet', 'error');
        } else if (vStatus === 'wellformedness_error') {
            showToast('Wellformedness Error', 'Found semantic errors in tasknet', 'warning');
        } else if (vStatus === 'unsat') {
            showToast('UNSAT', 'No valid schedule found', 'warning');
        } else if (vStatus === 'violated') {
            showToast('Property Violations', 'Found property violations. Check error traces.', 'warning');
        } else if (vStatus === 'success') {
            showToast('Success', 'Valid schedule found!', 'success');
        }
    }
    </script>
</body>
</html>
