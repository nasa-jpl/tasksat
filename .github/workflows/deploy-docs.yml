name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      # The whole package: the Formal Grammar page is generated from the parser,
      # and the Sphinx API reference from every module's docstrings.
      - 'src/smt/**'
      - 'doc/api/**'
      - 'requirements.txt'
      - 'requirements-docs.txt'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        # Runtime deps too: Sphinx autodoc imports the modules it documents.
        run: pip install -r requirements.txt -r requirements-docs.txt
        working-directory: ${{ github.workspace }}
      - name: Build website
        # `prebuild` (package.json) regenerates two things before the Docusaurus
        # build: the Formal Grammar page + grammar.txt (gen_grammar_doc.py) and
        # the Sphinx API reference into static/api/ (doc/api/).
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
